name: Run guessing game (go version)

on:
  workflow_dispatch:
  schedule:
    # Standard Time (Jan–Mar, Oct–Dec) at 08:00 UTC
    - cron: '0 8 * 1-3 *'
    - cron: '0 8 * 10-12 *'
    # Daylight Saving Time (Mar–Oct) at 07:00 UTC
    - cron: '0 7 * 3-10 *'
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  run-go:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run container
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/wordguesser-go:latest
          docker run --rm \
            -e DISCORD_WEBHOOK_URL="${{ secrets.DISCORD_WEBHOOK }}" \
            -e API_URL="${{ secrets.API_URL }}" \
            -v "${PWD}/output.txt:/app/output.txt" \
            ghcr.io/${{ github.repository_owner }}/wordguesser-go:latest
